# Example Nginx gateway for one private organization.
# Replace the example host, certificate paths, and internal auth-proxy name.
# The identity proxy must validate customer SSO and authorize the pilot group;
# this template does not implement an identity provider integration itself.
# Keep the API token include generated by the secret manager, mode 0640 or
# stricter, readable only by the Nginx worker group, and outside the web root.
# Its contents must be: proxy_set_header Authorization "Bearer <token>";
# Never place the token in this file, a browser, an environment variable, or
# a query parameter. The gateway overwrites any incoming Authorization header.

upstream ats_final_boss {
    server ats-review:8000;
    keepalive 8;
}

upstream customer_sso_authorizer {
    # Internal auth_request-compatible service, not a public IdP endpoint.
    server customer-sso-auth-proxy:4180;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=ats_analysis_per_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ats_connections_per_ip:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name ats.example.internal;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    # Do not write default access records containing client IPs or request
    # paths/query strings that may carry document-derived details.
    access_log off;
    client_max_body_size 7m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 100s;

    # Mount this directory as bounded tmpfs in the gateway container/host.
    # Uploaded bodies must not land in persistent gateway storage.
    client_body_temp_path /var/cache/nginx/client_temp 1 2;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /_customer_sso_authorize {
        internal;
        proxy_pass http://customer_sso_authorizer/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        auth_request /_customer_sso_authorize;
        limit_conn ats_connections_per_ip 20;
        proxy_pass http://ats_final_boss;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 100s;
        proxy_read_timeout 100s;
        proxy_request_buffering on;
        proxy_buffering off;
        include /etc/nginx/private/ats-api-token.conf;
    }

    location = /analyze {
        auth_request /_customer_sso_authorize;
        limit_conn ats_connections_per_ip 2;
        limit_req zone=ats_analysis_per_ip burst=3 nodelay;
        proxy_pass http://ats_final_boss;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 100s;
        proxy_read_timeout 100s;
        proxy_request_buffering on;
        proxy_buffering off;
        include /etc/nginx/private/ats-api-token.conf;
    }
}
