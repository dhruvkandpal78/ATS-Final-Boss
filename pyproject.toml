[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-final-boss"
version = "0.2.0"
description = "Resume integrity analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "starlette>=0.52.0",
    "uvicorn>=0.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "transformers>=4.38.0",
    "termcolor>=2.4.0",
    "reportlab>=4.0.0",
    "httpx>=0.28.0"
]
models = [
    "xgboost>=2.0.0"
]
security = [
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
    "PyYAML>=6.0.0"
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
markers = ["integration: requires provisioned local model artifacts and cached embeddings"]
