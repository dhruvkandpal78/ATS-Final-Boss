[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-final-boss"
version = "0.2.0"
description = "Resume integrity analysis"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "transformers>=4.38.0",
    "termcolor>=2.4.0"
]
models = [
    "xgboost>=2.0.0"
]
